name: ticky-crm-dev

services:
  db:
    image: mariadb:11.8
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: dev-root-password
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: dev-db-password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  nextcloud:
    build:
      context: ./docker/dev
      args:
        NC_VERSION: ${NC_VERSION:-33}
    ports:
      - "127.0.0.1:${NC_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: dev-db-password
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-admin-dev-password}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    volumes:
      - nextcloud:/var/www/html
      - ./:/var/www/html/custom_apps/ticky_crm
    healthcheck:
      test: [CMD, php, -r, "$$s = json_decode(@file_get_contents('http://localhost/status.php'), true); exit(($$s['installed'] ?? false) && !($$s['maintenance'] ?? true) && !($$s['needsDbUpgrade'] ?? true) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30

volumes:
  database:
  nextcloud:
